<!DOCTYPE html>
<html>
<head>
    <title>Hello World</title>
    <link href="plugin.css" rel="stylesheet">
</head>
<body>
    <div class="pluginContainer">
        <h1>Hello World</h1>
        <p>Create a cuboid of the specified size at the origin.</p>
        <div>
            <input id="Width" type=number value =12 />
            <label>Width</label>
        </div>
        <div>
            <input id="Length" type=number value =12 />
            <label>Length</label>
        </div>
        <div>
            <input id="Height" type=number value =12 />
            <label>Height</label>
        </div>
        <input id="CreateBlockBtn" type=button value="Create Cuboid" />

<hr>


<!-- FORMIT AI MODELER V2 -->

<div class="ai-modeler">

    <h2>FormIt AI Modeler V2</h2>
    <p>Generador de geometria arquitectonica</p>

    <hr>

    <!-- GENERADOR DE MUROS -->

    <h3>V1 - Crear Muro</h3>

    <label>Largo (m)</label>
    <input id="WallLength" type="number"
           value="5" step="0.01"><br>

    <label>Altura (m)</label>
    <input id="WallHeight" type="number"
           value="2.70" step="0.01"><br>

    <label>Espesor (m)</label>
    <input id="WallThickness" type="number"
           value="0.15" step="0.01"><br>

    <br>

    <button type="button" id="CreateWallBtn">
        Crear muro 3D
    </button>

    <p id="WallStatus"></p>

    <hr>

    <!-- GENERADOR DE HABITACIONES -->

    <h3>V2 - Crear Habitacion</h3>

    <label>Largo X (m)</label>
    <input id="RoomLength" type="number"
           value="5" step="0.01"><br>

    <label>Ancho Y (m)</label>
    <input id="RoomWidth" type="number"
           value="4" step="0.01"><br>

    <label>Altura (m)</label>
    <input id="RoomHeight" type="number"
           value="2.70" step="0.01"><br>

    <label>Espesor (m)</label>
    <input id="RoomThickness" type="number"
           value="0.15" step="0.01"><br>

    <h4>Posicion de la habitacion</h4>

    <label>Coordenada X (m)</label>
    <input id="RoomX" type="number"
           value="0" step="0.01"><br>

    <label>Coordenada Y (m)</label>
    <input id="RoomY" type="number"
           value="0" step="0.01"><br>

    <label>Coordenada Z (m)</label>
    <input id="RoomZ" type="number"
           value="0" step="0.01"><br>

    <br>

    <button type="button" id="CreateRoomBtn">
        Crear habitacion 3D
    </button>

    <p id="RoomStatus"></p>

</div>

        <!--Do not remove below scripts unless you know what you're doing-->
        <script type="text/javascript" src="https://formit3d.github.io/SharedPluginUtilities/FormIt.js"></script>
        <script type="text/javascript" src="https://formit3d.github.io/SharedPluginUtilities/FormItInterface.js"></script>
        <script type="text/javascript" src="https://formit3d.github.io/SharedPluginUtilities/PluginUtils.js"></script>
        <script type="text/javascript" src="plugin.js"></script>
        <script type="text/javascript">
            FormItInterface.Initialize();
        </script>
    </div>
</body>
</html>
